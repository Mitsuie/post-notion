version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # パッチ・マイナーは 1 つの PR にまとめる。メジャーはグループ外となり個別 PR になる
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 実行環境の Node（.node-version）を上げるときに合わせて上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint が TS 7 に対応してから、計画的に移行する
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
