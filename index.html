<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link id="app-favicon" rel="icon" type="image/png" href="/icon_light.png" />
  <link rel="apple-touch-icon" href="/icon_dark.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Post-Notion" />
  <title>Post-Notion | パーソナルSNS風ナレッジ収集基盤</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  
  <style>
    /* 起動前ローディング & フェイルセーフ専用インラインCSS */
    :root {
      --boot-bg: #f8fafc;
      --boot-text: #0f172a;
      --boot-muted: #64748b;
      --boot-card: rgba(255, 255, 255, 0.9);
      --boot-border: #e2e8f0;
      --boot-primary: #0284c7;
      --boot-primary-text: #ffffff;
      --boot-danger: #ef4444;
      --boot-radius: 12px;
      --boot-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg: #0a0f1d;
        --boot-text: #f8fafc;
        --boot-muted: #94a3b8;
        --boot-card: rgba(15, 23, 42, 0.85);
        --boot-border: #1e293b;
        --boot-primary: #38bdf8;
        --boot-primary-text: #0a0f1d;
      }
    }
    html[data-theme="dark"] {
      --boot-bg: #0a0f1d;
      --boot-text: #f8fafc;
      --boot-muted: #94a3b8;
      --boot-card: rgba(15, 23, 42, 0.85);
      --boot-border: #1e293b;
      --boot-primary: #38bdf8;
      --boot-primary-text: #0a0f1d;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--boot-bg);
      color: var(--boot-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    }
    #boot-skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 16px;
    }
    .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--boot-border);
      border-top-color: var(--boot-primary);
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    #app-boot-fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: var(--boot-bg);
      padding: 24px;
      align-items: center;
      justify-content: center;
    }
    .boot-fallback-card {
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      background: var(--boot-card);
      border: 1px solid var(--boot-border);
      border-radius: var(--boot-radius);
      padding: 28px 24px;
      box-shadow: var(--boot-shadow);
      text-align: center;
      box-sizing: border-box;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .boot-fallback-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: var(--boot-danger);
    }
    .boot-fallback-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--boot-text);
    }
    .boot-fallback-desc {
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--boot-muted);
      margin: 0 0 24px;
    }
    .boot-fallback-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: opacity 0.15s ease;
    }
    .boot-btn-primary {
      background-color: var(--boot-primary);
      color: var(--boot-primary-text);
      margin-bottom: 10px;
    }
    .boot-btn-secondary {
      background-color: transparent;
      color: var(--boot-muted);
      border: 1px solid var(--boot-border);
      font-size: 0.82rem;
    }
  </style>
  <script>
    // テーマの初期即時適用（チラつき防止）
    try {
      var savedTheme = localStorage.getItem('post-notion-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    } catch(e) {}
  </script>
</head>

<body>
  <!-- React アプリケーションマウント先 -->
  <div id="root">
    <div id="boot-skeleton">
      <div class="boot-spinner"></div>
      <div style="font-size: 0.85rem; color: var(--boot-muted); font-weight: 500;">起動中...</div>
    </div>
  </div>

  <!-- 【絶対白画面にしない】React起動前のインライン フェイルセーフ画面 -->
  <div id="app-boot-fallback">
    <div class="boot-fallback-card">
      <svg class="boot-fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h2 class="boot-fallback-title">セッションが切れた可能性があります</h2>
      <p class="boot-fallback-desc">
        Cloudflare Access の認証期限が切れたか、通信エラーが発生しました。<br>
        下のボタンを押して再ログインしてください。
      </p>
      <button type="button" class="boot-fallback-btn boot-btn-primary" onclick="window.reauthAndReload()">
        再ログインする（再読み込み）
      </button>
      <button type="button" class="boot-fallback-btn boot-btn-secondary" onclick="window.clearCacheAndReload()">
        キャッシュを初期化して再接続
      </button>
    </div>
  </div>

  <script>
    // 起動監視スクリプト
    (function() {
      var fallbackEl = document.getElementById('app-boot-fallback');
      var isMounted = false;

      // 再ログイン処理
      window.reauthAndReload = function() {
        window.location.reload(true);
      };

      // キャッシュ初期化＆再接続
      window.clearCacheAndReload = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      };

      // React が正常起動した際に呼ばれるフラグ
      window.__APP_MOUNTED__ = function() {
        isMounted = true;
        if (fallbackEl) {
          fallbackEl.style.display = 'none';
        }
      };

      function showFallback() {
        if (!isMounted && fallbackEl) {
          fallbackEl.style.display = 'flex';
        }
      }

      // 1. スクリプト取得失敗・構文エラー（HTML返却によるSyntaxError等）のキャッチ
      window.addEventListener('error', function(event) {
        // scriptタグの読み込み失敗
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          showFallback();
        }
        // スクリプト構文エラー等
        if (event.message && (event.message.indexOf('SyntaxError') !== -1 || event.message.indexOf('Unexpected token') !== -1)) {
          showFallback();
        }
      }, true);

      // 2. 起動タイムアウト監視 (3.5秒経過してもReactがマウントされない場合は白画面防止UIを表示)
      setTimeout(function() {
        if (!isMounted) {
          showFallback();
        }
      }, 3500);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
